
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | WalaName</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

    <div class="login-container">

        <!-- BRAND -->
        <div class="login-brand">
            <div class="login-logo">W</div>
            <h1>Wala<span>Name</span></h1>
            <p>Smart Energy Monitoring System</p>
        </div>

        <!-- LOGIN FORM -->
        <div class="login-card">
            <h2>Welcome Back</h2>
            <p class="login-subtitle">
                Sign in to monitor your energy consumption.
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <div class="login-options">
                    <label class="remember-option">
                        <input type="checkbox" name="remember">
                        Remember me
                    </label>

                    <a href="#" onclick="alert('Password recovery will be available after authentication is connected.'); return false;">
                        Forgot password?
                    </a>
                </div>

                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >
                    Sign In
                </button>

                <!-- LOGIN ERROR / SUCCESS MESSAGE -->
                <p id="loginMessage" class="login-subtitle"></p>

            </form>

            <div class="login-divider">
                <span>OR</span>
            </div>

            <p class="signup-text">
                Don't have an account?
                <a href="signup.html">Create an account</a>
            </p>
        </div>


        <!-- FOOTER -->
        <p class="login-footer">
            © 2026 WalaName | Intelligent Energy Monitoring
        </p>

    </div>

    <!-- SUPABASE LOGIN SCRIPT -->
    <script type="module" src="login.js"></script>

</body>
</html>
