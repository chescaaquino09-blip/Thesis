
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | WalaName</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

    <div class="login-container">

        <div class="login-brand">
            <div class="login-logo">W</div>
            <h1>Wala<span>Name</span></h1>
            <p>Smart Energy Monitoring System</p>
        </div>

        <div class="login-card">
            <h2>Create Account</h2>
            <p class="login-subtitle">
                Register to monitor your energy consumption.
            </p>

            <form id="signupForm">

                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input
                        type="text"
                        id="fullname"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        minlength="8"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        minlength="8"
                        required
                    >
                </div>

                <button type="submit" class="login-button" id="signupButton">
                    Create Account
                </button>

                <p id="signupMessage" class="login-subtitle"></p>

            </form>

            <div class="login-divider">
                <span>OR</span>
            </div>

            <p class="signup-text">
                Already have an account?
                <a href="login.html">Sign In</a>
            </p>
        </div>

        <a href="login.html" class="back-home">
            ← Back to Login
        </a>

        <p class="login-footer">
            © 2026 WalaName | Intelligent Energy Monitoring
        </p>

    </div>

    <script type="module" src="signup.js"></script>

</body>
</html>
